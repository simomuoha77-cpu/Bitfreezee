<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>JetX – BetaKE</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  font-family:'Rajdhani',sans-serif;
  background:#0b0a14;color:#fff;
  height:100%;overflow:hidden;
}
body{display:flex;flex-direction:column;height:100dvh;height:100vh}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;height:46px;
  background:linear-gradient(180deg,#15121f,#100e19);
  border-bottom:1px solid #221e30;flex-shrink:0;
}
.back-btn{
  font-size:13px;color:#8a83a3;background:none;border:none;
  cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;
  display:flex;align-items:center;gap:4px;
}
.avi-logo{
  display:flex;align-items:center;gap:6px;
  font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:900;
  color:#3d7bff;font-style:italic;letter-spacing:.5px;
  text-shadow:0 0 20px rgba(61,123,255,.45);
}
.avi-logo img{
  height:28px;width:auto;filter:drop-shadow(0 0 8px rgba(61,123,255,.6));
  transform:rotate(-8deg);
}
.bal{
  font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;
  color:#3ce67d;cursor:pointer;display:flex;align-items:center;gap:4px;
  background:rgba(60,230,125,.08);border:1px solid rgba(60,230,125,.18);
  padding:4px 10px;border-radius:20px;
}
.bal-kes{color:#6b8f7c;font-size:10px;font-weight:600}
.menu-btn{background:none;border:none;color:#6b6480;font-size:18px;cursor:pointer;margin-left:8px}
.fs-btn{
  background:none;border:1px solid #2a2540;color:#8a83a3;
  font-size:11px;font-weight:700;border-radius:6px;
  padding:5px 8px;cursor:pointer;margin-left:8px;
  font-family:'Rajdhani',sans-serif;display:flex;align-items:center;gap:4px;
  white-space:nowrap;
}
.fs-btn:active{background:#1c1830}

/* Fullscreen mode: hide chrome below the canvas so it can expand */
body.fs .hbar,
body.fs .bpanel,
body.fs .btable{display:none}

/* ── HISTORY BAR ── */
.hbar{
  display:flex;align-items:center;gap:5px;padding:5px 10px;
  background:#120f1c;border-bottom:1px solid #1e1a2b;
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;height:30px;
}
.hbar::-webkit-scrollbar{display:none}
.hc{
  flex-shrink:0;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700;font-family:'Rajdhani',sans-serif;
}
.hc.r{background:rgba(61,123,255,.16);color:#ff5d78;border:1px solid rgba(61,123,255,.28)}
.hc.b{background:rgba(120,150,255,.13);color:#8aa4ff;border:1px solid rgba(120,150,255,.22)}
.hc.y{background:rgba(255,180,0,.13);color:#ffc233;border:1px solid rgba(255,180,0,.22)}
.hc.p{background:rgba(190,90,255,.15);color:#d29bff;border:1px solid rgba(190,90,255,.28)}
.hmore{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;
  background:#1e1a2b;border:1px solid #2a2540;color:#6b6480;
  cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;
}

/* ── GAME CANVAS — default constrained height, expandable ── */
.game-wrap{
  position:relative;width:100%;
  height:30vh;flex-shrink:0;
  background:radial-gradient(120% 90% at 50% 100%,#1a1330 0%,#100c1c 45%,#0a0812 100%);
  overflow:hidden;transition:height .25s ease;
}
body.fs .game-wrap{
  flex:1;min-height:0;height:auto;
}
#gc{display:block;width:100%;height:100%}

/* ── MULTIPLIER ── */
.mwrap{
  position:absolute;top:38%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;z-index:2;width:100%;
}
.mval{
  font-family:'Rajdhani',sans-serif;
  font-size:clamp(52px,14vw,88px);
  font-weight:900;line-height:1;
}
.mval.fly{
  color:#3ddc6f;
  text-shadow:0 0 50px rgba(61,220,111,.55),0 0 100px rgba(61,220,111,.3);
}
.mval.crash{color:#ff4d4d;text-shadow:0 0 30px rgba(255,77,77,.7)}
.mval.wait{display:none}

/* ── WAIT OVERLAY ── */
.wovl{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  z-index:4;background:rgba(10,8,18,.94);
}
.wovl.on{display:flex}
.wtxt{font-size:10px;color:#5a5470;letter-spacing:4px;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.wnum{
  font-family:'Rajdhani',sans-serif;
  font-size:clamp(70px,18vw,96px);font-weight:900;
  color:#ffd600;line-height:1;
  text-shadow:0 0 30px rgba(255,214,0,.5);
  transition:transform .1s;
}
.wnum.tick{transform:scale(1.15)}

/* ── PLAYERS BADGE ── */
.pbadge{
  position:absolute;bottom:8px;right:10px;
  display:flex;align-items:center;gap:4px;
  background:rgba(20,16,32,.7);border-radius:20px;
  padding:3px 10px;font-size:11px;color:#8a83a3;
  z-index:2;border:1px solid #2a2540;
}
.pavs{display:flex}
.pav{
  width:18px;height:18px;border-radius:50%;
  background:#241f3a;border:1.5px solid #3a3258;
  margin-left:-5px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:8px;
}
.pav img{width:100%;height:100%;object-fit:cover}

/* ── FAIR BADGE ── */
.fair{
  position:absolute;top:8px;left:10px;
  background:rgba(20,16,32,.65);border:1px solid #2a2540;
  border-radius:5px;padding:2px 8px;font-size:9px;color:#8a83a3;
  cursor:pointer;z-index:2;
}

/* ── BET PANEL — fixed height ── */
.bpanel{
  background:#15121f;
  border-top:1px solid #221e30;
  padding:8px 10px 10px;
  flex-shrink:0;
}
.mtabs{
  display:inline-flex;background:#100e19;
  border-radius:20px;padding:3px;
  margin-bottom:8px;border:1px solid #221e30;
}
.mtab{
  padding:4px 20px;border-radius:16px;font-size:12px;font-weight:700;
  cursor:pointer;color:#6b6480;border:none;background:none;
  font-family:'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  transition:all .2s;
}
.mtab.on{background:#2a2440;color:#fff}

/* Per-slot Bet/Auto tabs */
.mtabs2{
  display:flex;background:#100e19;
  border-radius:20px;padding:3px;
  margin-bottom:5px;border:1px solid #221e30;
}
.mtab2{
  flex:1;padding:5px 0;border-radius:16px;font-size:11px;font-weight:700;
  cursor:pointer;color:#6b6480;border:none;background:none;
  font-family:'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:.4px;
  transition:all .2s;
}
.mtab2.on{background:#2a2440;color:#fff}

/* Auto cashout row */
.acorow{
  display:flex;align-items:center;justify-content:space-between;
  background:#100e19;border:1px solid #24203a;border-radius:8px;
  padding:6px 10px;margin-bottom:6px;
}
.acolbl{font-size:11px;color:#8a83a3;font-weight:700}
.acoinp{display:flex;align-items:center;gap:3px}
.acoinp input{
  width:56px;text-align:right;font-size:14px;font-weight:700;
  background:none;border:none;color:#fff;outline:none;
  font-family:'Rajdhani',sans-serif;
}
.acoinp span{font-size:12px;color:#8a83a3;font-weight:700}

.abtn.bauto{
  background:linear-gradient(160deg,#2a2440,#342c4d);
  color:#e8e2f5;border:1px solid #3a3258;
}
.abtn.bauto.running{
  background:linear-gradient(160deg,#c4001a,#ff2d3d);
  color:#fff;box-shadow:0 4px 16px rgba(255,45,61,.35);
}
.abtn.bauto:active{transform:scale(.97)}

/* Two slots side by side */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{flex:1;background:#1c1830;border-radius:10px;padding:8px 8px 7px;border:1px solid #24203a}

.srow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sbtn{
  width:30px;height:30px;border-radius:50%;
  background:#2a2440;border:1px solid #342c4d;
  color:#b0a8c9;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .1s;line-height:1;
}
.sbtn:active{background:#3a3258;transform:scale(.87)}
.sinp{
  flex:0.6;text-align:center;font-size:15px;font-weight:700;
  background:none;border:none;color:#fff;outline:none;
  font-family:'Rajdhani',sans-serif;min-width:0;
}
.abtn{
  width:100%;height:46px;border-radius:10px;border:none;
  font-size:16px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;line-height:1.2;
  font-family:'Rajdhani',sans-serif;letter-spacing:.3px;
  transition:all .18s;margin-top:5px;
}
/* The Bet/Cash Out button now sits INSIDE .srow, alongside the −/input/+
   stepper (matches Spribe's own layout), so it needs to be small and
   square instead of a full-width bar — this overrides the shared .abtn
   defaults above just for that placement. .bauto (Start Autobet) stays
   full-width/bar-shaped since it's a separate row on its own. */
.srow .abtn{
  width:auto;flex:1;height:56px;flex-shrink:0;margin-top:0;
  font-size:15px;border-radius:10px;
}
.srow .abtn .sub{display:block;font-size:10px;opacity:.85}
.abtn .sub{font-size:10px;font-weight:600;opacity:.85}
.abtn.bbet{
  /* REAL FIX: JetX's real bet button is yellow/gold, not Aviator's green
     — this was still using Aviator's exact color, one more place this
     was a reskin instead of actually matching JetX. */
  background:linear-gradient(160deg,#ffcc00,#ffaa00);
  color:#1a1200;box-shadow:0 4px 16px rgba(255,180,0,.35);
}
.abtn.bbet:active{transform:scale(.97)}
.abtn.bcash{
  background:linear-gradient(160deg,#ff8a00,#ffcc00);
  color:#1a1200;animation:cpulse .5s infinite alternate;
}
@keyframes cpulse{
  from{box-shadow:0 0 8px rgba(255,204,0,.5)}
  to{box-shadow:0 0 28px rgba(255,204,0,1),0 0 50px rgba(255,140,0,.35)}
}
.abtn.bwait{background:#1c1830;border:1px solid #24203a;color:#4a4460}
.abtn.bplaced{background:#1c1830;border:1px solid #342c4d;color:#8a83a3}
.abtn.bqueued{background:#241c40;border:1px solid #4a3d8a;color:#b3a6ff}
.abtn:disabled{opacity:.4;cursor:not-allowed;animation:none;box-shadow:none}

.qrow{display:flex;justify-content:space-between;gap:6px;margin-bottom:5px}
.qs{
  background:#100e19;border:1px solid #24203a;border-radius:8px;
  width:40px;height:40px;flex-shrink:0;
  font-size:11px;font-weight:700;color:#6b6480;
  cursor:pointer;text-align:center;font-family:'Rajdhani',sans-serif;
  display:flex;align-items:center;justify-content:center;
  transition:all .1s;
}
.qs:active{background:#2a2440;color:#e8e2f5}

/* ── BETS TABLE ── */
.btable{
  background:#120f1c;border-top:1px solid #1e1a2b;
  flex:1 1 auto;min-height:0;max-height:130px;overflow:hidden;
  display:flex;flex-direction:column;
}
.btabs2{display:flex;border-bottom:1px solid #1e1a2b;flex-shrink:0}
.btab2{
  flex:1;padding:6px 4px;text-align:center;font-size:11px;
  font-weight:700;color:#5a5470;cursor:pointer;
  border-bottom:2px solid transparent;transition:all .2s;text-transform:uppercase;
}
.btab2.on{color:#fff;border-bottom-color:#3d7bff}
.bhead{
  display:grid;grid-template-columns:1fr 60px 44px 60px;
  padding:4px 10px;font-size:9px;font-weight:700;color:#3a3552;
  text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1px solid #1a1728;flex-shrink:0;
}
.blist{flex:1;overflow-y:auto;scrollbar-width:none}
.blist::-webkit-scrollbar{display:none}
.brow{
  display:grid;grid-template-columns:1fr 60px 44px 60px;
  padding:5px 10px;font-size:11px;
  border-bottom:1px solid rgba(255,255,255,.03);align-items:center;
}
.brow .un{font-weight:700;color:#9089a8}
.brow .cx{color:#3ce67d;font-weight:700;font-size:10px}
.brow .cw{color:#3ce67d;font-weight:700}
.brow .pd{color:#332e48;font-style:italic}

/* ── TOAST ── */
.toast{
  position:fixed;top:54px;left:50%;transform:translateX(-50%);
  background:#1c1830;border-radius:8px;padding:8px 16px;
  font-size:13px;font-weight:700;z-index:999;
  opacity:0;transition:opacity .25s;pointer-events:none;
  border:1px solid #342c4d;white-space:nowrap;
  font-family:'Rajdhani',sans-serif;
}
.toast.on{opacity:1}
.toast.tw{border-color:#3ce67d;color:#3ce67d}
.toast.tl{border-color:#3d7bff;color:#3d7bff}
.toast.ti{border-color:#ffd600;color:#ffd600}

/* ── CRASH FLASH ── */
@keyframes cflash{0%{background:rgba(61,123,255,.22)}100%{background:transparent}}
.cf{animation:cflash .35s ease-out forwards}

/* ── WIN SPLASH ── */
.wsplash{
  position:absolute;top:35%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;z-index:10;opacity:0;
}
.wsplash.show{animation:wsanim .9s ease-out forwards}
@keyframes wsanim{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.8)}
  60%{opacity:1;transform:translate(-50%,-80%) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-110%) scale(1)}
}
.wsamt{
  font-family:'Rajdhani',sans-serif;font-size:clamp(24px,6vw,38px);
  font-weight:900;color:#ffd600;
  text-shadow:0 0 20px rgba(255,214,0,.7);
}
.wsmul{font-size:13px;color:#aaa;margin-top:2px}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <button class="back-btn" onclick="history.back()">← Go Back</button>
  <div class="avi-logo"><svg width="30" height="30" viewBox="0 0 100 100" style="filter:drop-shadow(0 0 6px rgba(255,204,0,.5))">
    <!-- REAL FIX: matches the actual JetX brand mark (white fighter jet
         banking up-right, yellow swept wing beneath, trailing motion
         streaks) instead of the generic rocket used before. -->
    <g transform="translate(50,50) rotate(-35) translate(-50,-50)">
      <!-- motion streaks trailing behind the jet -->
      <path d="M8 70 L38 62 L34 68 L10 76 Z" fill="#ffcc00" opacity="0.85"/>
      <path d="M4 58 L34 52 L30 58 L6 64 Z" fill="#fff" opacity="0.55"/>
      <path d="M2 46 L26 42 L23 47 L4 51 Z" fill="#ffcc00" opacity="0.4"/>
      <!-- lower swept wing (yellow) -->
      <path d="M46 58 L78 74 L70 76 L40 64 Z" fill="#ffcc00"/>
      <!-- fuselage (white), nose at top-right -->
      <path d="M84 14 C 70 26, 56 40, 44 56 L38 62 L46 58 L58 50 C 68 40, 78 28, 88 18 Z" fill="#f4f7ff"/>
      <!-- upper wing / tailfin accent (white, slightly offset for depth) -->
      <path d="M50 46 L30 34 L38 32 L56 42 Z" fill="#e2e8f5"/>
      <!-- nose tip highlight -->
      <circle cx="86" cy="16" r="3" fill="#ffcc00"/>
    </g>
  </svg>JetX</div>
  <div style="display:flex;align-items:center">
    <div class="bal" title="Your SafariBet balance">
      <span id="bv">0.00</span><span class="bal-kes">KES</span>
    </div>
    <button class="fs-btn" id="fsBtn" onclick="toggleFS()">⤢ Fullscreen</button>
    <button class="menu-btn">☰</button>
  </div>
</div>

<!-- HISTORY BAR -->
<div class="hbar" id="hbar">
  <span class="hc b">1.01x</span><span class="hc b">1.92x</span>
  <span class="hc b">1.00x</span><span class="hc b">1.20x</span>
  <span class="hc p">6.24x</span><span class="hc b">1.00x</span>
  <span class="hc b">1.91x</span><span class="hc b">1.98x</span>
  <span class="hc y">2.55x</span><span class="hc y">2.10x</span>
  <span class="hc b">1.44x</span><span class="hc y">3.50x</span>
  <button class="hmore">•••</button>
</div>

<!-- GAME CANVAS — FULL HEIGHT -->
<div class="game-wrap" id="gw">
  <canvas id="gc"></canvas>
  <div class="mwrap"><div class="mval wait" id="mv">1.00x</div></div>
  <div class="wsplash" id="wsplash">
    <div class="wsamt" id="wsamt">+0.00</div>
    <div class="wsmul" id="wsmul">@ 1.00x</div>
  </div>
  <div class="wovl" id="wo">
    <!-- REAL FIX: real JetX shows "RECEIVING BETS" during the waiting
         window with no visible countdown number at all (see reference
         screenshot) — Aviator's "STARTING IN 5,4,3..." countdown is a
         different game's UI convention. The actual countdown timer logic
         is untouched (still 5 seconds server-side, still drives when
         flight starts) — only the number display is hidden, matching
         JetX's real look. -->
    <div class="wtxt">RECEIVING BETS</div>
    <div class="wnum" id="wn" style="display:none">5</div>
  </div>
  <div class="fair" onclick="openFair()">🔒 Provably Fair</div>
  <div class="pbadge">
    <div class="pavs">
      <div class="pav">👤</div><div class="pav">👤</div><div class="pav">👤</div>
    </div>
    <span id="pc">221</span>
  </div>
</div>

<!-- BET PANEL -->
<div class="bpanel">
  <div class="slots">
    <!-- SLOT 1 -->
    <div class="slot">
      <div class="mtabs2">
        <button class="mtab2 on" id="mt1-bet" onclick="switchMode(1,'bet')">Bet</button>
        <button class="mtab2" id="mt1-auto" onclick="switchMode(1,'auto')">Auto</button>
      </div>

      <!-- Manual bet panel -->
      <div id="panel1-bet">
        <div class="qrow">
          <button class="qs" onclick="ss(1,100)">100</button>
          <button class="qs" onclick="ss(1,200)">200</button>
          <button class="qs" onclick="ss(1,500)">500</button>
          <button class="qs" onclick="ss(1,10000)">10K</button>
        </div>
        <div class="srow">
          <button class="sbtn" onclick="chg(1,-10)">−</button>
          <input class="sinp" id="s1" type="number" value="10" min="10"/>
          <button class="sbtn" onclick="chg(1,10)">+</button>
          <button class="abtn bbet" id="b1" onclick="hbet(1)">
            Bet<br><span class="sub" id="b1s">10.00 KES</span>
          </button>
        </div>
      </div>

      <!-- Auto bet panel -->
      <div id="panel1-auto" style="display:none">
        <div class="srow">
          <button class="sbtn" onclick="chgA(1,-10)">−</button>
          <input class="sinp" id="s1a" type="number" value="10" min="10"/>
          <button class="sbtn" onclick="chgA(1,10)">+</button>
        </div>
        <div class="acorow">
          <span class="acolbl">Cash Out at</span>
          <div class="acoinp">
            <input type="number" id="ac1" value="2.00" min="1.01" step="0.01" onchange="clampAuto(1)"/>
            <span>×</span>
          </div>
        </div>
        <button class="abtn bauto" id="ba1" onclick="toggleAuto(1)">Start Autobet</button>
      </div>
    </div>

    <!-- SLOT 2 -->
    <div class="slot">
      <div class="mtabs2">
        <button class="mtab2 on" id="mt2-bet" onclick="switchMode(2,'bet')">Bet</button>
        <button class="mtab2" id="mt2-auto" onclick="switchMode(2,'auto')">Auto</button>
      </div>

      <!-- Manual bet panel -->
      <div id="panel2-bet">
        <div class="qrow">
          <button class="qs" onclick="ss(2,100)">100</button>
          <button class="qs" onclick="ss(2,200)">200</button>
          <button class="qs" onclick="ss(2,500)">500</button>
          <button class="qs" onclick="ss(2,10000)">10K</button>
        </div>
        <div class="srow">
          <button class="sbtn" onclick="chg(2,-10)">−</button>
          <input class="sinp" id="s2" type="number" value="10" min="10"/>
          <button class="sbtn" onclick="chg(2,10)">+</button>
          <button class="abtn bbet" id="b2" onclick="hbet(2)">
            Bet<br><span class="sub" id="b2s">10.00 KES</span>
          </button>
        </div>
      </div>

      <!-- Auto bet panel -->
      <div id="panel2-auto" style="display:none">
        <div class="srow">
          <button class="sbtn" onclick="chgA(2,-10)">−</button>
          <input class="sinp" id="s2a" type="number" value="10" min="10"/>
          <button class="sbtn" onclick="chgA(2,10)">+</button>
        </div>
        <div class="acorow">
          <span class="acolbl">Cash Out at</span>
          <div class="acoinp">
            <input type="number" id="ac2" value="2.00" min="1.01" step="0.01" onchange="clampAuto(2)"/>
            <span>×</span>
          </div>
        </div>
        <button class="abtn bauto" id="ba2" onclick="toggleAuto(2)">Start Autobet</button>
      </div>
    </div>
  </div>
</div>

<!-- BETS TABLE -->

<script>
// ══════════════════════════════════════
//  STATE

let ST='waiting',HIST=[],PLAYERS=[];
let BET1=null,BET2=null,USER=null;
// QUEUED[s] holds a stake amount the user asked to bet WHILE the plane was
// already flying — see doBet()'s flightActive branch. Placed automatically
// the moment the next round opens (see poll()'s 'waiting' handling), never
// retroactively applied to the round that was flying when it was queued.
let QUEUED={1:null,2:null};
let lastRound=null,prevST='waiting',lastTickM=0;
let localMulti=1.00,flightActive=false,flyStart=null,pathPts=[];
// Drives the new camera-follow flight scene in draw(): frozenElapsed
// locks the jet/background at the exact instant of a crash (so nothing
// keeps scrolling once the round is over); resetFadeStart times the
// short cross-fade back to the calm idle scene once the next round's
// waiting period begins.
let frozenElapsed=null, resetFadeStart=null;
let waitTimer=null,countVal=5,countdownRound=null;

// (Rocket is now drawn as vectors — see drawRocketShape() — no external image asset needed)

// ══════════════════════════════════════
//  AUTOBET STATE
// ══════════════════════════════════════
// mode: 'bet' | 'auto'  — which panel is shown per slot
let MODE={1:'bet',2:'bet'};
// running: whether autobet loop is active for that slot
let AUTO={1:{running:false,placedThisRound:false},2:{running:false,placedThisRound:false}};

// ══════════════════════════════════════
//  AUDIO — flying loop + crash sound (real files)
// ══════════════════════════════════════
// REAL FIX: JetX previously reused Aviator's exact embedded audio clips
// (same engine hum, same crash sound) — just two Audio() elements with
// identical base64 data. That's not "a different sound", it's the same
// sound. Replaced with a small Web Audio API synth so JetX has its own
// distinct rocket-launch hum and explosion, with zero shared assets.
// PROFESSIONAL AUDIO REWRITE: the previous version used a static low
// (~90Hz) detuned-sawtooth drone for the whole flight and a heavy bass
// "thud" on crash — in practice that read as a discouraging, alarm-like
// foghorn during play and a punishing doom-boom on loss, which is the
// wrong emotional register for a betting game. Real crash-game audio
// does the opposite: an energetic, rising tone that builds excitement as
// the multiplier climbs, and a short, bright, arcade-style "pop" on
// crash rather than a heavy detonation. Rewritten to match that.
let _ac=null;
function getAC(){
  if(!_ac){ try{ _ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ _ac=null; } }
  if(_ac && _ac.state==='suspended'){ _ac.resume().catch(()=>{}); }
  return _ac;
}

// Flight tone: a clean, airy sine+triangle pair starting around a
// pleasant mid pitch, with gentle rising shimmer as the multiplier
// grows — mirrors the "climbing" feel players expect, without the
// static drone.
let _engine=null;
function startJet(instant){
  const ac = getAC();
  if(!ac) return;
  if(_engine) return; // already running
  try{
    const master = ac.createGain();
    master.gain.value = 0;
    master.connect(ac.destination);
    master.gain.linearRampToValueAtTime(0.14, ac.currentTime + (instant?0.05:0.35));

    const filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1400;
    filter.Q.value = 0.6;
    filter.connect(master);

    // Base tone + a soft fifth above it — pleasant, not alarming.
    const base = ac.createOscillator();
    base.type = 'sine';
    base.frequency.value = 220;
    base.connect(filter);
    base.start();

    const fifth = ac.createOscillator();
    fifth.type = 'triangle';
    fifth.frequency.value = 330;
    const fifthGain = ac.createGain();
    fifthGain.gain.value = 0.35;
    fifth.connect(fifthGain);
    fifthGain.connect(filter);
    fifth.start();

    // Airy shimmer layer, very quiet, adds motion without harshness.
    const shimmer = ac.createOscillator();
    shimmer.type = 'sine';
    shimmer.frequency.value = 660;
    const shimmerGain = ac.createGain();
    shimmerGain.gain.value = 0.08;
    shimmer.connect(shimmerGain);
    shimmerGain.connect(filter);
    shimmer.start();

    _engine = { master, filter, base, fifth, shimmer, startedAt: ac.currentTime };
  }catch(e){}
}
// Called every animation frame while flying (see animLoop) so pitch
// rises smoothly with the multiplier instead of staying static.
function updateJetPitch(mult){
  if(!_engine) return;
  try{
    const ac = getAC();
    if(!ac) return;
    const t = ac.currentTime;
    const rise = Math.min(mult, 12); // cap the rise so it never gets shrill
    _engine.base.frequency.setTargetAtTime(220 + rise*14, t, 0.15);
    _engine.fifth.frequency.setTargetAtTime(330 + rise*21, t, 0.15);
    _engine.shimmer.frequency.setTargetAtTime(660 + rise*40, t, 0.15);
    _engine.filter.frequency.setTargetAtTime(1400 + rise*90, t, 0.2);
  }catch(e){}
}
function stopJet(){
  if(!_engine) return;
  const ac = getAC();
  try{
    const now = ac ? ac.currentTime : 0;
    _engine.master.gain.cancelScheduledValues(now);
    _engine.master.gain.setValueAtTime(_engine.master.gain.value, now);
    _engine.master.gain.linearRampToValueAtTime(0, now + 0.1);
    const e = _engine;
    setTimeout(()=>{
      try{
        e.base.stop(); e.fifth.stop(); e.shimmer.stop();
      }catch(err){}
    }, 180);
  }catch(e){}
  _engine = null;
}
// Crash: a short, bright "pop" — a quick pitched click plus a brief
// high-passed noise tick. Snappy and arcade-like, not a heavy explosion
// that reads as punishing.
function playCrash(){
  stopJet();
  const ac = getAC();
  if(ac){
    try{
      const t = ac.currentTime;

      // Pitched click: short descending sine, gives a clear "pop" without bass rumble.
      const click = ac.createOscillator();
      click.type = 'sine';
      click.frequency.setValueAtTime(520, t);
      click.frequency.exponentialRampToValueAtTime(180, t + 0.12);
      const clickGain = ac.createGain();
      clickGain.gain.setValueAtTime(0.35, t);
      clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      click.connect(clickGain);
      clickGain.connect(ac.destination);
      click.start(t);
      click.stop(t + 0.15);

      // Brief bright noise tick (high-passed, very short) for texture.
      const dur = 0.12;
      const buf = ac.createBuffer(1, ac.sampleRate*dur, ac.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<data.length;i++){
        data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 3);
      }
      const noise = ac.createBufferSource();
      noise.buffer = buf;
      const hp = ac.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1200;
      const noiseGain = ac.createGain();
      noiseGain.gain.setValueAtTime(0.25, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      noise.connect(hp);
      hp.connect(noiseGain);
      noiseGain.connect(ac.destination);
      noise.start(t);
      noise.stop(t + dur);
    }catch(e){}
  }
  document.getElementById('gw').classList.add('cf');
  setTimeout(()=>document.getElementById('gw').classList.remove('cf'),350);
}
function playCashout(){ /* silent — sound removed */ }
function playBet(){ /* silent — sound removed */ }
function playTick(){ /* silent — sound removed */ }
function playCountTick(){ /* silent — sound removed */ }

// ══════════════════════════════════════
//  CANVAS
// ══════════════════════════════════════
const cv=document.getElementById('gc');
const cx=cv.getContext('2d');
function resizeCanvas(){
  const gw=document.getElementById('gw');
  cv.width=gw.clientWidth;cv.height=gw.clientHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

function toggleFS(){

  const btn = document.getElementById('fsBtn');
  btn.innerHTML = isFS ? '⤢ Exit Fullscreen' : '⤢ Fullscreen';
  // Wait for CSS transition/layout to settle, then resize the canvas

}

// ── FLIGHT SCENE ────────────────────────────────────────────────────────
// Complete rewrite from the old "point travels along path.t/path.r across
// a mostly-static backdrop" approach (still visually a straight-ish
// diagonal, same shape family as Aviator) to a camera-follow scene: the
// jet stays roughly centered on screen with an organic curved bob/bank,
// and the WORLD scrolls past it in multiple parallax layers — the actual
// visual difference the brief asked for, not just a different sprite.
function mixC(c1,c2,t){t=Math.min(Math.max(t,0),1);return [c1[0]+(c2[0]-c1[0])*t,c1[1]+(c2[1]-c1[1])*t,c1[2]+(c2[2]-c1[2])*t];}
function rgbStr(c){return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}

const ALT_PALS=[
  {top:[43,31,92],  bottom:[91,63,168], horizon:[255,190,120]}, // low atmosphere — warm horizon
  {top:[24,28,74],  bottom:[58,74,150], horizon:[170,200,255]}, // mid altitude — cool blue
  {top:[8,8,28],    bottom:[20,18,58],  horizon:[120,140,220]}, // near space — dark indigo
];
const CRASH_PAL={top:[42,10,20],bottom:[18,6,10],horizon:[255,80,60]};

function draw(){
  const W=cv.width,H=cv.height;
  cx.clearRect(0,0,W,H);
  const now=performance.now();
  const crashed=(ST==='crashed');

  // elapsed: live while flying, frozen at the crash instant while the
  // crash is showing, null (idle scene) before a round has started.
  let elapsed=null;
  if(flightActive && flyStart!==null) elapsed=(now-flyStart)/1000;
  else if(crashed && frozenElapsed!==null) elapsed=frozenElapsed;
  const flying=elapsed!==null;

  // Reset fade: 0 = just crashed, 1 = fully back to idle. Blends the
  // crash-red palette back to normal over ~650ms once a fresh round
  // begins, instead of the scene snapping back instantly.
  let resetFade=1;
  if(resetFadeStart!==null){
    resetFade=Math.min((now-resetFadeStart)/650,1);
    if(resetFade>=1) resetFadeStart=null;
  }

  // ── ALTITUDE-BASED PALETTE — the environment itself visibly changes as
  // the multiplier climbs: thick warm low-atmosphere haze near 1x, cooling
  // to high-altitude blue by ~5x, thinning into near-space indigo with
  // stars beyond ~15x. Smooth log-based cross-fade, never a hard cut.
  const altT=flying?Math.min(Math.log(Math.max(localMulti,1))/2.7,2):0;
  let altPal;
  if(altT<=1) altPal={top:mixC(ALT_PALS[0].top,ALT_PALS[1].top,altT),bottom:mixC(ALT_PALS[0].bottom,ALT_PALS[1].bottom,altT),horizon:mixC(ALT_PALS[0].horizon,ALT_PALS[1].horizon,altT)};
  else altPal={top:mixC(ALT_PALS[1].top,ALT_PALS[2].top,altT-1),bottom:mixC(ALT_PALS[1].bottom,ALT_PALS[2].bottom,altT-1),horizon:mixC(ALT_PALS[1].horizon,ALT_PALS[2].horizon,altT-1)};

  let pal=altPal;
  if(crashed) pal=CRASH_PAL;
  else if(resetFadeStart!==null) pal={top:mixC(CRASH_PAL.top,altPal.top,resetFade),bottom:mixC(CRASH_PAL.bottom,altPal.bottom,resetFade),horizon:mixC(CRASH_PAL.horizon,altPal.horizon,resetFade)};

  const sky=cx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,rgbStr(pal.top));
  sky.addColorStop(1,rgbStr(pal.bottom));
  cx.fillStyle=sky;cx.fillRect(0,0,W,H);

  const horizonY=H*0.72;
  const glow=cx.createRadialGradient(W*0.5,horizonY,0,W*0.5,horizonY,W*0.6);
  glow.addColorStop(0,`rgba(${pal.horizon[0]|0},${pal.horizon[1]|0},${pal.horizon[2]|0},0.28)`);
  glow.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=glow;cx.fillRect(0,0,W,H);

  // ── SCROLL PHASE — always strictly increasing while flying (never
  // plateaus to zero motion, only the RATE eases toward a cruise speed),
  // so the world keeps visibly moving no matter how long a round runs.
  // Idle scenes drift on wall-clock time at a much gentler ambient rate.
  const cruiseSpeed=flying?Math.min(70+elapsed*10,420):16;
  const scrollBase=flying?elapsed*cruiseSpeed:(now/1000)*cruiseSpeed;

  // ── STARS (fade in at altitude) — farthest layer, barely moves ──
  const starAlpha=flying?Math.max(0,Math.min((altT-0.6)/0.6,1))*0.8:0;
  if(starAlpha>0.01){
    cx.save();cx.globalAlpha=starAlpha;cx.fillStyle='#fff';
    const span=W+120;
    for(let i=0;i<26;i++){
      const bx=(i*137)%span;
      const x=(((bx-scrollBase*0.03)%span)+span)%span-60;
      const y=(i*53)%(H*0.65);
      cx.beginPath();cx.arc(x,y,1+((i%3)*0.6),0,Math.PI*2);cx.fill();
    }
    cx.restore();
  }

  // ── DISTANT SKYLINE SILHOUETTE (fades out as altitude rises) ──
  const cityAlpha=flying?Math.max(0,1-altT*0.9):0.5;
  if(cityAlpha>0.02){
    cx.save();cx.globalAlpha=cityAlpha*0.5;cx.fillStyle='#140f2e';
    const span=W+240;
    for(let i=0;i<7;i++){
      const bx=i*170;
      const x=(((bx-scrollBase*0.12)%span)+span)%span-120;
      const w=60+((i*37)%40),h=H*(0.08+((i*29)%5)/40);
      cx.fillRect(x,horizonY-h,w,h);
    }
    cx.restore();
  }

  // ── MID CLOUDS — parallax layer, always present, denser at low alt ──
  const midAlpha=(crashed?0.3:0.55)*(1-altT*0.35);
  cx.save();cx.globalAlpha=Math.max(midAlpha,0.15);
  const midSpan=W+300;
  for(let i=0;i<6;i++){
    const bx=i*180+60;
    const x=(((bx-scrollBase*0.35)%midSpan)+midSpan)%midSpan-150;
    const y=H*0.18+(i%3)*H*0.09;
    const s=0.7+(i%3)*0.25;
    cx.fillStyle='#ffffff';
    cx.beginPath();
    cx.ellipse(x,y,38*s,14*s,0,0,Math.PI*2);
    cx.ellipse(x+26*s,y+4*s,26*s,11*s,0,0,Math.PI*2);
    cx.ellipse(x-24*s,y+3*s,24*s,10*s,0,0,Math.PI*2);
    cx.fill();
  }
  cx.restore();

  // ── JET POSITION — organic curved bob/bank, camera roughly follows it
  // (screen X stays near 34% across) instead of the jet traversing the
  // canvas end to end. Climb tied to log(multiplier); wobble is two
  // out-of-phase sine waves so the path isn't a single clean curve either.
  let jetX=W*0.22, jetY=H*0.68, angle=-0.05;
  if(flying){
    const climb=Math.min(Math.log(Math.max(localMulti,1))*0.16,0.30);
    const wob=t=>Math.sin(t*0.9)*0.028+Math.sin(t*0.37+1.1)*0.016;
    const wobX=t=>Math.sin(t*0.5+0.4)*0.02;
    jetX=W*(0.34+wobX(elapsed));
    jetY=H*(0.56-climb+wob(elapsed));
    const dt=0.1, e2=Math.max(elapsed-dt,0);
    const climb2=Math.min(Math.log(Math.max(Math.exp(0.09*e2),1))*0.16,0.30);
    const jx2=W*(0.34+wobX(e2)), jy2=H*(0.56-climb2+wob(e2));
    angle=-0.12+Math.atan2(jetY-jy2,jetX-jx2)*0.55;
  } else if(!crashed){
    const t=now/1000;
    jetY=H*0.68+Math.sin(t*1.2)*H*0.01;
    angle=-0.05+Math.sin(t*0.8)*0.03;
  }

  // ── EXHAUST TRAIL — fixed relative to the jet (not a history array):
  // fading puffs at set offsets behind it, drifting slightly with the
  // same wobble so they read as "left behind by the scrolling world".
  if(flying && !crashed){
    cx.save();
    for(let i=1;i<=7;i++){
      const age=i/7;
      const back=i*10;
      const px=jetX-Math.cos(angle)*back;
      const py=jetY-Math.sin(angle)*back+Math.sin(elapsed*2-i)*3;
      cx.globalAlpha=Math.max(0,0.4*(1-age));
      cx.fillStyle='#ffffff';
      cx.beginPath();cx.arc(px,py,4+age*5,0,Math.PI*2);cx.fill();
    }
    cx.restore();
  }

  // ── FOREGROUND SPEED STREAKS — fastest parallax layer, gives the
  // strongest sense of forward velocity, intensifies as elapsed grows.
  if(flying && !crashed){
    const speedT=Math.min(elapsed/8,1);
    cx.save();cx.globalAlpha=0.25*speedT;cx.strokeStyle='#ffffff';cx.lineWidth=2;
    const span=W+200;
    for(let i=0;i<5;i++){
      const bx=i*160;
      const x=(((bx-scrollBase*0.9)%span)+span)%span-100;
      const y=H*(0.3+(i%3)*0.18);
      const len=30+speedT*40;
      cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-len,y);cx.stroke();
    }
    cx.restore();
  }

  // ── JET / EXPLOSION ──
  if(!crashed && flying){
    cx.save();
    cx.translate(jetX,jetY);
    cx.rotate(angle);
    cx.shadowBlur=18;cx.shadowColor='rgba(61,123,255,.6)';
    drawRocketShape(cx);
    cx.restore();
  } else if(!crashed){
    // Idle pre-round pose — jet sits near the start area, gently idling.
    cx.save();
    cx.translate(jetX,jetY);
    cx.rotate(angle);
    cx.shadowBlur=10;cx.shadowColor='rgba(61,123,255,.4)';
    drawRocketShape(cx);
    cx.restore();
  } else {
    // Crash: jet stopped dead at its frozen position, explosion burst
    // plus a brief flash that fades as resetFade advances.
    cx.save();
    cx.translate(jetX,jetY);
    const burst=cx.createRadialGradient(0,0,0,0,0,46);
    burst.addColorStop(0,'rgba(255,220,120,0.9)');
    burst.addColorStop(0.4,'rgba(255,100,40,0.7)');
    burst.addColorStop(1,'rgba(255,40,20,0)');
    cx.fillStyle=burst;
    cx.beginPath();cx.arc(0,0,46,0,Math.PI*2);cx.fill();
    cx.restore();
    if(resetFadeStart===null){
      // still fresh crash (fade hasn't started yet) — flash the screen
      cx.save();cx.globalAlpha=0.12;cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.restore();
    }
  }
}


// Draws a simple rocket (nose cone + body + window + fins + flame),
// pointing along +x — caller rotates/translates before calling this so it
// always points the right way for the current flight angle. No external
// image asset needed, unlike the plane logo this replaced.
function drawRocketShape(cx){
  const L=46, W=13; // length, half-width of the body
  cx.beginPath();
  cx.moveTo(L*0.55,0); // nose tip
  cx.quadraticCurveTo(L*0.15,-W,-L*0.45,-W*0.7);
  cx.lineTo(-L*0.45,W*0.7);
  cx.quadraticCurveTo(L*0.15,W,L*0.55,0);
  cx.closePath();
  cx.fillStyle='#dfe8ff';
  cx.fill();
  cx.strokeStyle='#3d7bff';cx.lineWidth=1.5;cx.stroke();
  // window
  cx.beginPath();cx.arc(L*0.05,0,W*0.35,0,Math.PI*2);
  cx.fillStyle='#3d7bff';cx.fill();
  // fins
  cx.beginPath();
  cx.moveTo(-L*0.3,-W*0.6);cx.lineTo(-L*0.55,-W*1.3);cx.lineTo(-L*0.15,-W*0.6);cx.closePath();
  cx.moveTo(-L*0.3,W*0.6);cx.lineTo(-L*0.55,W*1.3);cx.lineTo(-L*0.15,W*0.6);cx.closePath();
  cx.fillStyle='#3d7bff';cx.fill();
  // flame
  const flameLen=14+Math.random()*8; // flicker
  cx.beginPath();
  cx.moveTo(-L*0.45,-W*0.55);
  cx.quadraticCurveTo(-L*0.45-flameLen,0,-L*0.45,W*0.55);
  cx.closePath();
  const grad=cx.createLinearGradient(-L*0.45,0,-L*0.45-flameLen,0);
  grad.addColorStop(0,'#ffcc33');grad.addColorStop(1,'rgba(255,80,0,0)');
  cx.fillStyle=grad;cx.fill();
}

// ── PLANE DRAWING — matches screenshot exactly ──
function drawPlane(c,crashed){
  c.save();
  // Compact scale — small clean silhouette like Spribe
  c.scale(1.05,1.05);

  const red   = crashed?'#7a0000':'#ff2d3d';
  const redDk = crashed?'#5a0000':'#c4001a';
  const white = 'rgba(255,255,255,0.95)';

  // ══════════════════════════════════════
  //  PROPELLER — small spinning disc, nose-right
  // ══════════════════════════════════════
  c.save();
  c.translate(30, -2);
  const spinAngle = crashed ? 0.4 : (Date.now() * 0.02 % (Math.PI*2));
  c.rotate(spinAngle);
  // Motion-blur disc
  c.beginPath();c.arc(0,0,9,0,Math.PI*2);
  c.fillStyle=crashed?'rgba(120,0,0,.35)':'rgba(255,45,61,.28)';c.fill();
  // Two thin blades
  c.strokeStyle=redDk;c.lineWidth=2;c.lineCap='round';
  c.beginPath();c.moveTo(0,-9);c.lineTo(0,9);c.stroke();
  c.beginPath();c.moveTo(-9,0);c.lineTo(9,0);c.stroke();
  // Hub
  c.beginPath();c.arc(0,0,2.2,0,Math.PI*2);c.fillStyle=white;c.fill();
  c.restore();

  // ══════════════════════════════════════
  //  FUSELAGE — small tapered capsule body
  // ══════════════════════════════════════
  c.beginPath();
  c.moveTo(24,-1);                          // nose tip
  c.bezierCurveTo(20,-7, 10,-9, -4,-8);      // top curve to tail
  c.bezierCurveTo(-14,-7.5,-20,-5,-24,-1);   // tail taper top
  c.lineTo(-27,0);                            // tail point
  c.bezierCurveTo(-20,4,-14,6.5,-4,7);       // tail taper bottom
  c.bezierCurveTo(10,7.5,19,5,23,1);         // bottom curve to nose
  c.closePath();
  c.fillStyle=red;
  if(!crashed){c.shadowBlur=12;c.shadowColor='rgba(255,45,61,.55)';}
  c.fill();
  c.shadowBlur=0;

  // Thin white cockpit-line stripe
  c.beginPath();
  c.moveTo(18,-3);
  c.bezierCurveTo(10,-6.5,0,-7,-10,-6.3);
  c.lineTo(-10,-5.1);
  c.bezierCurveTo(0,-5.8,10,-5.3,17,-2.2);
  c.closePath();
  c.fillStyle=white;c.fill();

  // ══════════════════════════════════════
  //  COCKPIT canopy bump
  // ══════════════════════════════════════
  c.beginPath();
  c.ellipse(6,-8.5,5,3.6,0.15,0,Math.PI*2);
  c.fillStyle=white;c.fill();
  c.beginPath();
  c.ellipse(6,-8.2,3.6,2.5,0.15,0,Math.PI*2);
  c.fillStyle=red;c.fill();

  // ══════════════════════════════════════
  //  MAIN WING — single straight thin wing, angled back-down
  // ══════════════════════════════════════
  c.beginPath();
  c.moveTo(8,4);
  c.lineTo(-2,5.5);
  c.lineTo(-16,22);
  c.lineTo(-12,23);
  c.lineTo(2,7);
  c.closePath();
  c.fillStyle=red;c.fill();
  c.beginPath();
  c.moveTo(-2,6);c.lineTo(-13,21);
  c.strokeStyle=white;c.lineWidth=1;c.stroke();

  // ══════════════════════════════════════
  //  TAIL FIN — small single vertical fin
  // ══════════════════════════════════════
  c.beginPath();
  c.moveTo(-16,-6.5);
  c.lineTo(-24,-14);
  c.lineTo(-26,-13);
  c.lineTo(-20,-6);
  c.closePath();
  c.fillStyle=red;c.fill();

  // Small horizontal tailplane
  c.beginPath();
  c.moveTo(-20,-1);
  c.lineTo(-29,-3.5);
  c.lineTo(-29,-1.5);
  c.lineTo(-21,0.5);
  c.closePath();
  c.fillStyle=red;c.fill();

  // ══════════════════════════════════════
  //  ENGINE GLOW near prop
  // ══════════════════════════════════════
  if(!crashed){
    const eg=c.createRadialGradient(28,-2,0,28,-2,16);
    eg.addColorStop(0,'rgba(255,180,40,.28)');
    eg.addColorStop(0.5,'rgba(255,80,0,.10)');
    eg.addColorStop(1,'rgba(0,0,0,0)');
    c.beginPath();c.arc(28,-2,16,0,Math.PI*2);
    c.fillStyle=eg;c.fill();
  }

  c.restore();
}

// ══════════════════════════════════════
//  FLIGHT ENGINE (rAF — 60fps)
// ══════════════════════════════════════
function startFlight(elapsedMs){
  // elapsedMs lets a client that just loaded the page (or reconnected)
  // JOIN a round that's already flying, instead of restarting the local
  // animation clock at 0 — this is what keeps every viewer's multiplier
  // in sync with the one true server-side round, however late they
  // opened the page. Defaults to 0 for the normal case (this client saw
  // the round go from 'waiting' to 'flying' itself, so there's nothing
  // to catch up on).
  //
  // SANITY CAP: the server already guards against reporting an
  // unreasonable elapsedMs (see casino.js's MAX_REASONABLE_FLIGHT_SEC),
  // but this client-side cap is a second, independent safety net — if a
  // huge value ever did arrive here for any reason, Math.exp() of it
  // would render as an astronomically large, unreadable number on screen
  // instead of a normal multiplier. No legitimate round takes anywhere
  // near 120 seconds to resolve, so capping to that is always safe.
  const cappedElapsedMs=Math.min(elapsedMs||0,120000);
  flightActive=true;flyStart=performance.now()-cappedElapsedMs;
  localMulti=1.00;pathPts=[];lastTickM=0;
  startJet(false);
  updBtns(); // switch any placed-bet buttons to the enabled "Cash Out" state now that flight has begun
}
function stopFlight(){flightActive=false;}

function animLoop(ts){
  // Always redraw — keeps propeller spinning even during wait
  if(flightActive&&flyStart!==null){
    const elapsed=(ts-flyStart)/1000;
    // Display-layer safety net: the real game never has a crash point
    // above 50x (see casino.js's rollCrashPoint), so there's no legitimate
    // reason this local animation value should ever need to show more
    // than that. Without this cap, any upstream bug that lets a huge
    // elapsed value through would render as a giant unreadable number
    // instead of a normal multiplier.
    localMulti=Math.min(Math.exp(0.09*elapsed),60);
    updateJetPitch(localMulti);
    const mv=document.getElementById('mv');
    mv.className='mval fly';
    mv.textContent=localMulti.toFixed(2)+'x';
    // REAL BUG FIX: these used to be hard Math.min() clamps — tN capped at
    // .95 once elapsed passed 24*.95≈22.8s, rN capped at .92 once the
    // multiplier crossed ~10x. Once EITHER cap was hit, the plane didn't
    // slow down near the edge, it completely FROZE there (both values are
    // literal constants past that point) — visibly stuck pinned in the
    // corner for the rest of any round that ran a bit longer or higher
    // than that, exactly what was reported ("hits the end of the screen").
    // Real Spribe never does this: the plane keeps inching toward the edge
    // forever, always slightly closer, never fully arriving or stopping.
    //
    // Kept as a plain linear ramp (pixel-identical to the old formula) for
    // ordinary rounds — most rounds resolve well before this cutoff, so
    // this doesn't change how the vast majority of rounds look or feel at
    // all. Only past the cutoff (a round running longer/higher than usual)
    // does it switch to an asymptotic approach for the REMAINING distance
    // to the cap, so it keeps closing in on the edge forever without ever
    // technically reaching it or freezing solid — that switch is what
    // actually fixes the reported bug, without touching normal gameplay.
    const T_CUTOFF=20, T_CAP=.95, T_RATE=8;
    let tN;
    if (elapsed<=T_CUTOFF) {
      tN = elapsed/24;
    } else {
      const baseAtCutoff = T_CUTOFF/24;
      const remaining = T_CAP-baseAtCutoff;
      tN = baseAtCutoff + remaining*(1-Math.exp(-(elapsed-T_CUTOFF)/T_RATE));
    }
    const R_CUTOFF=.75, R_CAP=.92, R_RATE=.35;
    const rRaw = Math.log(Math.max(localMulti,1.001))*.40;
    let rN;
    if (rRaw<=R_CUTOFF) {
      rN = rRaw;
    } else {
      const remaining = R_CAP-R_CUTOFF;
      rN = R_CUTOFF + remaining*(1-Math.exp(-(rRaw-R_CUTOFF)/R_RATE));
    }
    pathPts.push({t:tN,r:rN});
    if(pathPts.length>800) pathPts.shift();
    if(Math.floor(localMulti*2)>Math.floor(lastTickM*2)){playTick();lastTickM=localMulti;}
    // Update cashout buttons
    [1,2].forEach(s=>{
      const bet=s===1?BET1:BET2,btn=document.getElementById('b'+s);
      if(bet&&!bet.cashedOut&&btn.classList.contains('bcash'))
        btn.innerHTML=`Cash Out<br><span class="sub">${localMulti.toFixed(2)}× — KES ${(bet.stake*localMulti).toFixed(2)}</span>`;
    });
    // Auto-cashout: if autobet running for a slot and target multiplier reached, cash out
    [1,2].forEach(s=>{
      const a=AUTO[s];
      const bet=s===1?BET1:BET2;
      if(a.running&&bet&&!bet.cashedOut){
        const target=parseFloat(document.getElementById('ac'+s).value)||0;
        if(target>=1.01&&localMulti>=target) doCash(s);
      }
    });
  }
  draw();
  requestAnimationFrame(animLoop);
}

// ══════════════════════════════════════
//  COUNTDOWN
// ══════════════════════════════════════
function startCountdown(from,roundId){
  if(countdownRound===roundId&&waitTimer) return;
  countdownRound=roundId;
  clearInterval(waitTimer);
  countVal=from||5;
  const el=document.getElementById('wn');
  el.textContent=countVal;
  el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick');
  setTimeout(()=>el.classList.remove('tick'),120);
  waitTimer=setInterval(()=>{
    countVal--;
    el.textContent=Math.max(0,countVal);
    el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick');
    setTimeout(()=>el.classList.remove('tick'),120);
    playCountTick();
    if(countVal<=0){
      clearInterval(waitTimer);waitTimer=null;
      document.getElementById('wo').classList.remove('on');
      document.getElementById('mv').style.display='block';
      if(!flightActive) startFlight();
    }
  },1000);
}

// ══════════════════════════════════════
//  POLL SERVER
// ══════════════════════════════════════
async function poll(){
  try{
    const tok=localStorage.getItem('token');
    const headers={'Content-Type':'application/json'};
    if(tok) headers['Authorization']='Bearer '+tok;
    // cache:'no-store' as a second, independent safety net alongside the
    // server's Cache-Control header (see noCacheAviator in server.js) —
    // this is what actually fixed a page reopening mid-flight sometimes
    // showing a stale 'waiting' countdown instead of the real in-progress
    // flight: some mobile browsers' back/forward-cache or aggressive HTTP
    // caching can otherwise still short-circuit the network request.
    const r=await fetch('/api/jetx/state',{headers,cache:'no-store'});
    if(r.status===401){showT('Invalid or missing API key — reload with ?key=jsk_xxx','tl');return;}
    const d=(await r.json()).data;
    if(!d) return;
    prevST=ST;ST=d.status;HIST=d.history||[];
    if(d.roundId!==lastRound){
      lastRound=d.roundId;
      if(ST!=='waiting'){BET1=null;BET2=null;}
      AUTO[1].placedThisRound=false;AUTO[2].placedThisRound=false;
      updBtns();
    }
    updHist();
    const wo=document.getElementById('wo'),mv=document.getElementById('mv');
    if(ST==='waiting'){
      if(flightActive){stopFlight();pathPts=[];}
      stopJet();
      frozenElapsed=null; resetFadeStart=performance.now(); // begin the smooth reset-to-idle fade
      mv.className='mval wait';mv.style.display='none';
      wo.classList.add('on');
      startCountdown(d.waitSeconds||5,d.roundId||lastRound||'init');
      // Auto-place bets for slots with autobet running
      [1,2].forEach(s=>{
        const a=AUTO[s];
        const bet=s===1?BET1:BET2;
        if(a.running&&!bet&&!a.placedThisRound){
          doBet(s);
          a.placedThisRound=true;
        }
      });
      // Place any bet queued while the plane was flying (see doBet()'s
      // flightActive branch) — this is the ONLY place a queued bet ever
      // gets placed, and it only runs once this round has genuinely
      // reached 'waiting', so it can never land in the round that was
      // flying when the user clicked.
      [1,2].forEach(s=>{
        const bet=s===1?BET1:BET2;
        if(QUEUED[s]&&!bet){
          const queuedStake=QUEUED[s];
          QUEUED[s]=null;
          doBet(s,queuedStake);
        }
      });
    } else if(ST==='flying'){
      wo.classList.remove('on');mv.style.display='block';
      if(!flightActive){
        startFlight(d.elapsedMs||0);
      }
    } else if(ST==='crashed'){
      // Freeze the flight scene at exactly the elapsed time it crashed —
      // captured once, on the first tick where we observe the crash
      // (flightActive is still true here iff this is that first tick),
      // so the background/jet don't keep advancing after impact.
      if(flightActive && flyStart!==null) frozenElapsed=(performance.now()-flyStart)/1000;
      if(flightActive) stopFlight();
      stopJet();
      if(prevST==='flying') playCrash();
      const cp=d.crashPoint||localMulti;
      mv.className='mval crash';mv.style.display='block';
      mv.textContent='Exploded @ '+cp.toFixed(2)+'×';
      [BET1,BET2].forEach((b,i)=>{
        if(b&&!b.cashedOut){
          b.cashedOut=true;
          showT('💥 Lost KES '+b.stake.toFixed(2),'tl');
          if(i===0)BET1=null;else BET2=null;
        }
      });updBtns();
    }
    fetch('/api/jetx/players',{headers,cache:'no-store'}).then(r=>r.json()).then(d=>{
      PLAYERS=d.data||[];
      document.getElementById('pc').textContent=PLAYERS.length;
      renderBL();
    }).catch(()=>{});
  }catch(e){}
}

function updHist(){
  if(!HIST.length) return;
  const bar=document.getElementById('hbar');
  // REAL BUG FIX: HIST comes from casino.js's `history` array, which is
  // built with history.unshift(round.crashPoint) — i.e. it's ALREADY
  // newest-first (see that file's own comment on the array). Calling
  // .reverse() here flipped it to oldest-first before slicing the first
  // 14, which meant this was actually displaying the OLDEST 14 rounds on
  // record, not the most recent ones — so a freshly-finished round (like
  // a new crash point) would never appear here at all once history grew
  // past ~14 entries, while stale old rounds stayed stuck on screen.
  // Slicing directly (no reverse) shows the true most recent rounds.
  const chips=HIST.slice(0,14).map(v=>{
    let cl='b';
    if(v>=10)cl='p';else if(v>=3)cl='y';else if(v<1.5)cl='r';
    return `<span class="hc ${cl}">${v.toFixed(2)}x</span>`;
  }).join('');
  bar.innerHTML=chips+`<button class="hmore">•••</button>`;
}

function renderBL(){
  const el=document.getElementById('bl');let tot=0;
  if(!PLAYERS.length){el.innerHTML='<div style="text-align:center;padding:14px;color:#222;font-size:11px">No bets yet</div>';return;}
  el.innerHTML=PLAYERS.map(p=>{
    if(p.cashedOut)tot+=p.won;
    return `<div class="brow">
      <span class="un">${p.username}</span>
      <span>${p.stake.toFixed(2)}</span>
      ${p.cashedOut
        ?`<span class="cx">${p.cashoutMultiplier.toFixed(2)}x</span><span class="cw">${p.won.toFixed(2)}</span>`
        :`<span class="pd">—</span><span class="pd">—</span>`}
    </div>`;
  }).join('');
}

// ══════════════════════════════════════
//  BET ACTIONS
// ══════════════════════════════════════
async function hbet(s){
  getAC();
  if(!localStorage.getItem('token')||!sessionStorage.getItem('utoken')){showT('Missing session — reload with ?key=jsk_xxx&utoken=...','ti');return;}
  const bet=s===1?BET1:BET2;
  const btn=document.getElementById('b'+s);
  if(btn.disabled) return;
  if(flightActive&&bet&&!bet.cashedOut) await doCash(s);
  // REAL BUG FIX: this branch used to just show a "Wait for next round"
  // toast and do NOTHING — it never actually called doBet(), so the new
  // queue-a-bet-during-flight feature (see doBet()'s flightActive branch)
  // was completely unreachable by clicking: the button visually updated to
  // say "next round", but tapping it just showed a message and queued
  // nothing. Calling doBet() here is what actually queues it — doBet
  // itself already shows its own "Queued — will bet KES X next round"
  // confirmation, so no separate toast is needed here anymore.
  else if(flightActive&&(!bet||bet.cashedOut)) await doBet(s);
  else if(!flightActive&&ST==='waiting'&&!bet) await doBet(s);
  else if(!flightActive&&ST==='waiting'&&bet) showT('Bet already placed ✓','ti');
  else if(ST==='crashed') showT('Wait for next round...','ti');
}

async function doBet(s,forcedStake){
  // forcedStake lets a queued bet (placed while the plane was flying —
  // see the flightActive branch below, and poll()'s 'waiting' handling)
  // use the EXACT stake the user queued, rather than re-reading whatever
  // happens to be in the input field by the time the next round opens.
  const stake=forcedStake!=null?forcedStake:getStake(s);
  if(!stake||stake<10) return showT('Min bet KES 10','tl');
  if(stake>100000) return showT('Max bet KES 100,000','tl');
  const tok=localStorage.getItem('token');
  const utoken=sessionStorage.getItem('utoken');
  if(!tok){showT('Session expired — reload with ?key=jsk_xxx&utoken=...','tl');return;}
  if(!utoken){showT('Missing signed session — reload with ?utoken=... from SafariBet','tl');return;}

  // REAL FIX: clicking Bet while the plane is already flying used to be
  // impossible — the button was fully disabled ("Wait / Next round") with
  // no way to act on it at all. Now it queues the stake and places it
  // automatically the instant the NEXT round opens (see the 'waiting'
  // branch in poll() below) — never in the round that's currently flying,
  // since that round's bets already closed the moment it took off.
  if(flightActive){
    const bet=s===1?BET1:BET2;
    if(bet){showT('Already have a bet this round','tl');return;}
    QUEUED[s]=stake;
    showT('Queued — will bet KES '+stake.toFixed(2)+' next round','ti');
    updBtns();
    return;
  }

  playBet();
  const btn=document.getElementById('b'+s);
  btn.disabled=true;
  // REAL BUG FIX for "clicking Bet at count 5 doesn't seem to register
  // until count 2": the actual bet confirmation has to wait on a real
  // network round-trip to SafariBet's own wallet endpoint (confirming the
  // real-money debit before the bet is allowed to exist — see
  // walletClient.js's debit(), which has its own 5s timeout for exactly
  // that external call). That wait is real and can't be skipped without
  // risking a bet existing before its money is actually confirmed moved.
  // What WAS missing is any immediate feedback that the click registered
  // at all — the button just sat disabled with no label change until the
  // slow network call finally resolved, which reads as "nothing happened
  // yet" for however long that takes. Showing "Placing..." right here,
  // before the network call even starts, makes the click itself feel
  // instant regardless of how long the wallet confirmation takes.
  btn.classList.add('bwait');
  btn.innerHTML='Placing...<br><span class="sub">KES '+stake.toFixed(2)+'</span>';
  try{
    const r=await fetch('/api/casino/play/bet',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
      body:JSON.stringify({utoken,gameId:'jetx',slot:s,stake})});
    if(r.status===401){showT('Invalid API key or session','tl');btn.disabled=false;updBtns();return;}
    const d=await r.json();
    if(d.success){
      if(s===1)BET1={stake,cashedOut:false,betId:d.betId};else BET2={stake,cashedOut:false,betId:d.betId};
      // REAL BUG FIX: this used to `await refreshBalance()` — a completely
      // separate network round-trip to /api/casino/play/balance — BEFORE
      // showing the success message, even though the bet had already
      // succeeded per this response. That meant "Bet successful" visibly
      // waited on a second, unrelated request to finish, especially
      // noticeable while the 5-second countdown is ticking and every
      // second of perceived delay matters. Showing success immediately
      // and letting the balance refresh happen in the background (not
      // awaited) fixes the lag without losing the balance update — it
      // just no longer blocks anything.
      showT('✅ Bet KES '+stake.toFixed(2),'ti');updBtns();
      refreshBalance();
    }else{showT(d.message||'Failed','tl');btn.disabled=false;updBtns();}
  }catch(e){showT('Connection error','tl');btn.disabled=false;updBtns();}
}

async function doCash(s){
  const bet=s===1?BET1:BET2;
  if(!bet||bet.cashedOut) return;
  if(!bet.betId){showT('No active bet reference — try reloading','tl');return;}
  bet.cashedOut=true;
  const btn=document.getElementById('b'+s);btn.disabled=true;
  const tok=localStorage.getItem('token');
  const utoken=sessionStorage.getItem('utoken');
  try{
    const r=await fetch('/api/casino/play/bet/'+encodeURIComponent(bet.betId)+'/cashout',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
      body:JSON.stringify({utoken})});
    const d=await r.json();
    if(d.success){
      // Same fix as doBet() above — show the cashout result the instant
      // this response confirms it succeeded, don't make it wait on a
      // second, separate balance-refresh request first.
      playCashout();
      showWinSplash(d.won,d.multiplier);
      showT(`💰 ${d.multiplier.toFixed(2)}× — Won KES ${d.won.toFixed(2)}`,'tw');
      if(s===1)BET1=null;else BET2=null;updBtns();
      refreshBalance();
    }else{bet.cashedOut=false;btn.disabled=false;showT(d.message||'Failed','tl');}
  }catch(e){bet.cashedOut=false;btn.disabled=false;showT('Connection error','tl');}
}

function updBtns(){
  [1,2].forEach(s=>{
    const btn=document.getElementById('b'+s);
    const stake=parseFloat(document.getElementById('s'+s).value)||0;
    const bet=s===1?BET1:BET2;
    btn.disabled=false;btn.className='abtn';
    if(flightActive&&bet&&!bet.cashedOut){
      btn.classList.add('bcash');
      btn.innerHTML=`Cash Out<br><span class="sub">${localMulti.toFixed(2)}× — KES ${(bet.stake*localMulti).toFixed(2)}</span>`;
    }else if(flightActive&&QUEUED[s]){
      // REAL FIX: this used to be lumped in with the plain "Wait / Next
      // round" disabled state below, giving no way to tell "I successfully
      // queued a bet" apart from "betting just isn't available right now".
      btn.classList.add('bqueued');
      btn.innerHTML=`Queued ✓<br><span class="sub">KES ${QUEUED[s].toFixed(2)} next round</span>`;
      btn.disabled=false; // stays clickable so the user can re-click to cancel/adjust before the round opens (see doBet's flightActive branch)
    }else if(flightActive){
      // REAL FIX: this used to be btn.disabled=true, making it impossible
      // to bet at all while a round was flying. Now clicking it queues a
      // stake for the NEXT round instead (see doBet()'s flightActive
      // branch) — never the round currently in the air, since that
      // round's betting window already closed the moment it took off.
      btn.classList.add('bbet');
      btn.innerHTML=`Bet<br><span class="sub">${stake.toFixed(2)} KES — next round</span>`;
    }else if(!flightActive&&bet){
      btn.classList.add('bplaced');btn.innerHTML=`Placed ✓<br><span class="sub">KES ${bet.stake.toFixed(2)}</span>`;btn.disabled=true;
    }else if(ST==='crashed'){
      btn.classList.add('bbet');btn.innerHTML=`Bet<br><span class="sub">${stake.toFixed(2)} KES</span>`;btn.disabled=true;
    }else{
      btn.classList.add('bbet');btn.innerHTML=`Bet<br><span class="sub">${stake.toFixed(2)} KES</span>`;
    }
    // Update sub label on amount change
    if(btn.classList.contains('bbet')){
      document.getElementById('b'+s+'s')?.remove();
    }
  });
}

function chg(s,d){const e=document.getElementById('s'+s);e.value=Math.max(10,(parseFloat(e.value)||10)+d);updBtns();}
function ss(s,v){document.getElementById('s'+s).value=v;updBtns();}
function chgA(s,d){const e=document.getElementById('s'+s+'a');e.value=Math.max(10,(parseFloat(e.value)||10)+d);}
document.getElementById('s1').addEventListener('input',updBtns);
document.getElementById('s2').addEventListener('input',updBtns);

// Returns the current stake for a slot, from whichever panel (bet/auto) is active
function getStake(s){
  const id = MODE[s]==='auto' ? ('s'+s+'a') : ('s'+s);
  return parseFloat(document.getElementById(id).value)||0;
}

function switchMode(s,mode){
  MODE[s]=mode;
  document.getElementById('mt'+s+'-bet').classList.toggle('on',mode==='bet');
  document.getElementById('mt'+s+'-auto').classList.toggle('on',mode==='auto');
  document.getElementById('panel'+s+'-bet').style.display = mode==='bet' ? '' : 'none';
  document.getElementById('panel'+s+'-auto').style.display = mode==='auto' ? '' : 'none';
}

function clampAuto(s){
  const el=document.getElementById('ac'+s);
  let v=parseFloat(el.value);
  if(!v||v<1.01) v=1.01;
  el.value=v.toFixed(2);
}

function toggleAuto(s){
  const a=AUTO[s];
  const btn=document.getElementById('ba'+s);
  if(!a.running){
    if(!localStorage.getItem('token')||!sessionStorage.getItem('utoken')){showT('Missing session — reload with ?key=jsk_xxx&utoken=...','ti');return;}
    clampAuto(s);
    a.running=true;
    btn.textContent='Stop Autobet';
    btn.classList.add('running');
    showT('🔁 Autobet ON — Slot '+s,'ti');
    // If a round is currently in waiting state and nothing placed yet, place immediately
    const bet=s===1?BET1:BET2;
    if(ST==='waiting'&&!flightActive&&!bet&&!a.placedThisRound){
      doBet(s);
      a.placedThisRound=true;
    }
  }else{
    a.running=false;
    btn.textContent='Start Autobet';
    btn.classList.remove('running');
    showT('⏹ Autobet OFF — Slot '+s,'ti');
  }
}

function switchBTab(el){document.querySelectorAll('.btab2').forEach(t=>t.classList.remove('on'));el.classList.add('on');}
function updBal(){if(USER)document.getElementById('bv').textContent=parseFloat(USER.balance||0).toFixed(2);}

// refreshBalance: pulls the user's REAL balance from SafariBet's own
// wallet, via JuanAi's verified-utoken passthrough route. This is the
// ONLY source of truth for the balance shown in this game — there is no
// separate "aviator balance" anymore.
async function refreshBalance(){
  const tok=localStorage.getItem('token'),utoken=sessionStorage.getItem('utoken');
  if(!tok||!utoken) return;
  try{
    const r=await fetch('/api/casino/play/balance?utoken='+encodeURIComponent(utoken),{
      headers:{'Authorization':'Bearer '+tok}});
    const d=await r.json();
    if(d.success){
      if(!USER) USER={};
      USER.balance=d.balance;
      updBal();
    }
  }catch(e){/* keep showing the last known balance rather than blanking it on a transient network error */}
}
function openFair(){showT('Provably fair — SHA256 seed revealed after crash 🔒','ti');}

let tTmr=null;
function showT(msg,cls=''){
  const el=document.getElementById('tst');el.textContent=msg;
  el.className='toast on '+cls;
  clearTimeout(tTmr);tTmr=setTimeout(()=>el.classList.remove('on'),3500);
}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
window.addEventListener('DOMContentLoaded',()=>{
  // ── URL bootstrap (real-money mode) ──
  // SafariBet's OWN backend generates a signed utoken for the specific
  // logged-in user (see userToken.js's sign(userId)) and embeds this page
  // as aviator.html?key=jsk_xxx&utoken=SIGNED_TOKEN. The browser never
  // mints utoken itself — it only carries along whatever SafariBet's
  // server already signed, which is what makes it safe to trust
  // server-side (see server.js's /api/casino/play/* routes).
  //
  // IMPORTANT: utoken is NOT persisted to localStorage across page loads
  // anymore. It used to be — but that meant if this page ever reloaded
  // without a fresh ?utoken= in the URL (browser back/forward on a cached
  // page, a stale bookmarked link, an iframe refresh that doesn't
  // re-append the query string, etc.), the OLD token from a previous
  // session would silently keep being used — showing whatever balance
  // belonged to whoever was last logged in on this device, not
  // necessarily the current real user. Requiring a fresh utoken in the
  // URL on every load closes that gap: no stale identity can ever leak
  // into a new session.
  const params=new URLSearchParams(location.search);
  const urlKey=params.get('key');
  const urlUtoken=params.get('utoken');
  if(urlKey) localStorage.setItem('token',urlKey); // the API key itself is not per-user, safe to persist
  if(urlUtoken){
    sessionStorage.setItem('utoken',urlUtoken); // sessionStorage, not localStorage — cleared when the tab closes, never silently reused across a different launch
  }

  const t=localStorage.getItem('token'),ut=sessionStorage.getItem('utoken');
  if(t&&ut){
    USER={balance:0}; // placeholder until refreshBalance() below fills in the real SafariBet balance
    refreshBalance();
    setInterval(refreshBalance,4000); // keep the displayed balance in sync with SafariBet's own ledger
  }else{
    showT('Missing session — open this page with ?key=jsk_xxx&utoken=...','tl');
  }

  // Unlock audio on first touch — Web Audio contexts start suspended on
  // mobile until a user gesture resumes them.
  let audioUnlocked=false;
  function unlockAudio(){
    if(audioUnlocked)return;audioUnlocked=true;
    getAC();
    if(flightActive)startJet(true);
  }
  document.addEventListener('touchstart',unlockAudio,{capture:true,once:true});
  document.addEventListener('click',unlockAudio,{capture:true,once:true});

  document.getElementById('wo').classList.add('on');
  startCountdown(5,'init');
  requestAnimationFrame(animLoop);
  poll();
  setInterval(poll,300);
});
</script>
